<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualiser</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <aside class="sidebar">
        <h1>Library</h1>

        <div id="login-box">
            <button id="login-btn">Connect to Spotify</button>
        </div>

        <div id="search-box">
            <input type="text" id="search-input" placeholder="Search for a new song...">
            <button id="back-to-lib-btn" class="hidden">
                Back to Local Library
            </button>
        </div>

        <div class="library-legend">
            <div class="legend-item"><span class="legend-dot demo"></span>Demo</div>
            <div class="legend-item"><span class="legend-dot upload"></span>Uploaded</div>
            <div class="legend-item"><span class="legend-dot import"></span>Snippet</div>
        </div>
        <div id="songs"></div>
    </aside>

    <div class="main-player-container">
        <nav class="navbar">
            <div class="song-info">
                <p id ="song-title"></p>
                <p id ="song-artist"></p>
            </div>

            <div class="nav-links">
                <a href="#/" class="nav-link">Player</a>
                <a href="#/upload" class="nav-link">Upload Song</a>
            </div>
        </nav>

        <main id="app">
            <div id="visualiser-box" class="screen">
                <div class="main-player">
                    <div class="visualiser-wrapper">
                        <canvas id="visualiser"></canvas>
                    </div>

                    <audio id="audio-element"></audio>

                    <div class="controls">
                        <button id="play-pause-btn">Play</button>
                        <div class="progress-container">
                            <span id="current-time" class="time-stamp">0:00</span>
                            <input type="range" id="progress-bar" value="0" min="0" step="0.1">
                            <span id="duration-time" class="time-stamp">0:00</span>
                        </div>
                        <div class="volume-container">
                            <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.05">
                        </div>
                    </div>

                    <div id="lyrics-container">
                        <p class="lyric-line empty">Lyrics will appear here...</p>
                    </div>
                </div>
            </div>

            <div id="upload" class="screen hidden">
                <div class="upload-container">
                    <h2>Add a New Track</h2>
                    <form id="upload-form">
                        <label for="title-input">Song Title:</label>
                        <input type="text" id="title-input" required>

                        <label for="artist-input">Artist:</label>
                        <input type="text" id="artist-input" required>

                        <label for="audio-file">Audio File (.mp3):</label>
                        <input type="file" id="audio-file" accept="audio/mp3" required>

                        <label for="lyrics-file">Lyrics File (.lrc or .txt):</label>
                        <input type="file" id="lyrics-file" accept=".lrc,.txt">

                        <button type="submit">Save Track</button>
                    </form>
                </div>
            </div>
        </main>
    </div> 
</body>
</html>
